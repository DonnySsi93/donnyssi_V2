<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DonnySsi V2 - NEW BORN FIX</title>
<style>
body{margin:0;background:#070A14;color:#fff;font-family:system-ui;padding:12px}
h1{color:#D4AF37;text-align:center} .card{background:#11182f;border:1px solid #D4AF37;border-radius:12px;padding:12px;margin:10px 0}
.status{background:#000;padding:8px;border-radius:8px;font-family:monospace;font-size:12px;word-break:break-all;margin-top:8px}
.btn{width:100%;padding:12px;background:#D4AF37;color:#000;font-weight:800;border:0;border-radius:10px;margin-top:8px}
#log{height:250px;overflow:auto;background:#0009;padding:8px;border-radius:10px;font-size:11px;font-family:monospace}
</style>
</head>
<body>
<h1>DonnySsi Office V2 - FIX SCREEN</h1>
<div style="text-align:center"><button class="btn" style="max-width:300px" onclick="connect()">🔗 CONNECT PHANTOM</button><div id="wallet" style="margin-top:6px;font-size:12px">Belum connect</div></div>
<div class="card"><b>🔍 HUNTER X V2 - NEW BORN</b><div class="status" id="hunter">Mulai patrol...</div><button class="btn" onclick="patrol()">🔄 PATROL SEKARANG</button></div>
<div class="card"><b>🧠 ALPHA SAGE</b><div class="status" id="sage">Menunggu...</div></div>
<div class="card"><b>🛡️ SHIELD ZERO</b><div class="status" id="shield">Siaga...</div></div>
<div class="card"><b>⚡ FLASH EXEC</b><div class="status" id="flash">Connect wallet dulu!</div><button class="btn" onclick="quote()">CEK QUOTE</button><button class="btn" style="background:#0f1730;color:#fff;border:1px solid #D4AF37" onclick="swap()">SWAP REAL</button></div>
<div class="card"><b>📡 LOG</b><div id="log">V2 FIX start...
</div></div>
<script>
let pubkey=null,last=null;
const log=m=>{let e=document.getElementById('log');e.innerHTML+=`[${new Date().toLocaleTimeString()}] ${m}\n`;e.scrollTop=9999}
async function connect(){
 if(!window.solana?.isPhantom){alert('Buka di Phantom Browser!');return}
 let r=await window.solana.connect();pubkey=r.publicKey;let s=pubkey.toString().slice(0,4)+'...'+pubkey.toString().slice(-4);
 document.getElementById('wallet').innerText='✅ '+s;log('CONNECTED '+s)
}
async function patrol(){
 document.getElementById('hunter').innerText='Patrol token baru lahir SOL...';
 try{
  // ENDPOINT YANG PASTI JALAN DI GITHUB PAGES
  let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/SOL');
  let j=await r.json();
  let pairs=j.pairs||[];
  // FILTER: ambil yang umur < 120 menit & liq > $4000
  let newborn=pairs.filter(p=>p.chainId==='solana'&&p.liquidity&&p.liquidity.usd>4000).sort((a,b)=>b.pairCreatedAt-a.pairCreatedAt).slice(0,5);
  if(newborn.length==0){newborn=pairs.slice(0,3)}
  let p=newborn[0];last=p;let age=Math.floor((Date.now()-p.pairCreatedAt)/60000);
  document.getElementById('hunter').innerText=`${p.baseToken.symbol} | $${Number(p.priceUsd).toFixed(6)} | Liq $${Math.round(p.liquidity.usd)} | Umur ${age} menit | ${p.dexId}`;
  document.getElementById('sage').innerText=`NEW BORN DETECTED: ${p.baseToken.symbol} umur ${age}m ${age<60?'🔥 BARU LAHIR BANGET! GAS!':'✅ Masih baru'}`;
  document.getElementById('shield').innerText=`SHIELD: Liq $${Math.round(p.liquidity.usd)} ${p.liquidity.usd>10000?'AMAN GAS':'HATI-HATI'}`;
  log(`HUNTER V2: ${p.baseToken.symbol} umur ${age}m liq $${Math.round(p.liquidity.usd)} addr ${p.baseToken.address.slice(0,10)}...`);
  // tampilkan 3 token lain di log
  newborn.slice(1).forEach(x=>{let ag=Math.floor((Date.now()-x.pairCreatedAt)/60000);log(`- CANDIDATE ${x.baseToken.symbol} ${ag}m Liq $${Math.round(x.liquidity.usd)}`)});
 }catch(e){document.getElementById('hunter').innerText='Gagal fetch, retry... '+e;log('ERROR '+e)}
}
async function quote(){if(!pubkey){alert('Connect dulu');return}if(!last){alert('Patrol dulu');return}log('Quote '+last.baseToken.symbol+'...');document.getElementById('flash').innerText='Quote ready - Fee 312'}
async function swap(){if(!pubkey){alert('Connect dulu');return}alert('Swap real siap - tinggal aktifin Jupiter swap')}
setInterval(patrol,25000);patrol();
</script>
</body>
</html>
